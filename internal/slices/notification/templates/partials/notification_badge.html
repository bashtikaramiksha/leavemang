<span id="unread-badge" hx-get="/notifications/unread-count" hx-trigger="load, every 10s" hx-swap="outerHTML" style="display: inline-flex; align-items: center; gap: 0.25rem;">
  🔔 {{if gt .UnreadCount 0}}<span style="background: #ef4444; color: white; border-radius: 9999px; padding: 0.1rem 0.45rem; font-size: 0.75rem; font-weight: 700; line-height: 1;">{{.UnreadCount}}</span>{{end}}
</span>
