{{define "content"}}
<div class="container">
  <div class="card">
    <h2 class="card-title">Assign Leave Balance</h2>
    <p class="card-subtitle">Allocate leave days for an active employee</p>

    {{if .Error}}
      <div class="alert alert-danger" style="margin-bottom: 1.25rem;">
        {{.Error}}
      </div>
    {{end}}

    <form method="POST" action="/leave-balances" hx-target="#form-error" hx-swap="innerHTML">
      <div id="form-error"></div>

      <div class="form-group">
        <label for="employee_id" class="form-label">Employee *</label>
        <select id="employee_id" name="employee_id" class="form-input" required>
          <option value="">-- Select Active Employee --</option>
          {{range .Employees}}
            <option value="{{.ID}}">{{.FullName}} ({{.EmployeeCode}}) - {{.Department}}</option>
          {{end}}
        </select>
      </div>

      <div class="form-group">
        <label for="leave_type_id" class="form-label">Leave Type *</label>
        <select id="leave_type_id" name="leave_type_id" class="form-input" required>
          <option value="">-- Select Active Leave Type --</option>
          {{range .LeaveTypes}}
            <option value="{{.ID}}">{{.Name}} ({{.Code}}) - Default {{.DefaultAllocation}} days</option>
          {{end}}
        </select>
      </div>

      <div class="form-group">
        <label for="allocated_days" class="form-label">Allocated Days *</label>
        <input 
          type="number" 
          id="allocated_days" 
          name="allocated_days" 
          class="form-input" 
          min="0" 
          value="12" 
          required
        >
      </div>

      <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
        <a href="/leave-balances" class="btn btn-danger" style="text-align: center;">Cancel</a>
        <button type="submit" class="btn btn-primary">Save Allocation</button>
      </div>
    </form>
  </div>
</div>
{{end}}
